create_basic_test_data: bash -c 'mkdir -p /config/www/grocy_processed && echo "[{\"name\":\"Test Chore\",\"date\":\"Today\",\"assigned_to\":\"Test User\",\"territorio\":\"Test Area\",\"luogo_di_lavoro\":\"Test Location\"}]" > /config/www/grocy_dashboard_data.json && echo "{\"count\":1,\"has_data\":true,\"territories\":[\"Test Area\"],\"locations\":[\"Test Location\"],\"people\":[\"Test User\"]}" > /config/www/grocy_processed/summary.json && echo "{\"0\":\"Test Chore\"}" > /config/www/grocy_processed/index.json && echo "{\"name\":\"Test Chore\",\"date\":\"Today\",\"assigned_to\":\"Test User\",\"territorio\":\"Test Area\",\"luogo_di_lavoro\":\"Test Location\"}" > /config/www/grocy_processed/chore_0.json'

