# Voltage monitoring commands
check_voltage_levels: >
  /bin/bash /config/python_scripts/run_wrapper.sh 
  --mode voltage
  --hass-token "{{ states('sensor.grocy_script_token') }}"
  --voltage-entity "{{ states('input_text.voltage_sensor_entity') }}"
  --previous-state-entity "input_boolean.voltage_alarm_active"
  > /config/www/logs/voltage_run.log 2>&1

test_voltage_monitoring: >
  python3 /config/python_scripts/debug/voltage_debug.py
  "{{ states('sensor.grocy_script_token') }}"
  "{{ states('input_text.voltage_sensor_entity') }}"
  > /config/www/logs/voltage_test.log 2>&1

check_alarm_voltage_log: >
  bash -c 'cat /config/www/logs/alarm_voltage.log 2>/dev/null | tail -n 50 || echo "No log file found"'

# Log management commands
run_log_manager: >
