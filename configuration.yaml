# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /local/grocy-dashboard/grocy-chores-card.js

# Include other YAML files
script: !include scripts.yaml
scene: !include scenes.yaml
automation: !include automations.yaml
telegram_bot: !include telegram_bot.yaml
shell_command: !include shell_command.yaml

# Notifier
notify:
  - platform: telegram
    name: "kermode"
    chat_id: !secret telegram_kermode_chat_id

# Input entities for configuration
input_text:
  grocy_url:
    name: Grocy API URL
    initial: !secret grocy_base_url
  grocy_api_key:
    name: Grocy API Key
    initial: !secret grocy_api_key
  shelly_caldaia_entity:
    name: Shelly Caldaia Entity
    initial: !secret shelly_caldaia_switch_entity_id
  voltage_sensor_entity:
    name: Voltage Sensor Entity
    initial: sensor.shelly_uni_voltage

input_boolean:
  debug_mode:
    name: Debug Mode
    initial: false
  voltage_alarm_active:
    name: Voltage Alarm Active
    initial: false
    icon: mdi:alarm-light
  enable_voltage_monitoring:
    name: Enable Voltage Monitoring
    initial: off
    icon: mdi:flash-alert

input_number:
  shelly_last_changed:
    name: Shelly Last Changed Timestamp
    min: 0
    max: 9999999999
    step: 1
    mode: box

# Template sensors
template:
  - sensor:
      - name: "Grocy Script Token"
        state: !secret grocy_script_token
        unique_id: grocy_script_token

      - name: "Grocy Chores Message"
        unique_id: grocy_chores_message
        state: >-
          {% set log_content = states('sensor.grocy_log_content') %}
          {% if log_content and log_content != 'unknown' and log_content != 'unavailable' %}
            {% set lines = log_content.split('\n') %}
            {% for line in lines %}
              {% if 'Sent notification with' in line %}
                {% set chores = line.split('Sent notification with')[1].split('chores')[0].strip() %}
                {% if chores %}
                  {{ chores }}
                  {% break %}
                {% endif %}
              {% endif %}
            {% endfor %}
            No chores found in log
          {% else %}
            No log data available
          {% endif %}
      # Add these below your existing sensors
      - name: "Grocy Run Status"
        unique_id: grocy_run_status
        state: "unknown"

      ########  For Grocy Maintenence Dashboard ########
      - name: "grocy_organized_chores"
        unique_id: grocy_organized_chores
        state: >-
          {% if states('sensor.grocy_log_content') != 'unknown' and states('sensor.grocy_log_content') != 'unavailable' %}
            Available
          {% else %}
            unavailable
          {% endif %}
        icon: mdi:calendar-check
        attributes:
          chores: >-
            [
              {% set chores_found = false %}
              {% set log_content = states('sensor.grocy_log_content') %}
              {% if log_content and log_content != 'unknown' and log_content != 'unavailable' %}
                {% set current_chore = namespace(data={}) %}
                {% set lines = log_content.split('\n') %}
                {% for line in lines %}
                  {% if 'Chore ' in line and 'userfields:' in line %}
                    {% set userfields_str = line.split('userfields:')[1] | trim %}
                    {% if userfields_str %}
                      {% set userfields_dict = namespace(data={}) %}
                      {% if "Territorio" in userfields_str %}
                        {% set territorio = userfields_str.split("'Territorio'")[1].split("'")[1] %}
                        {% set userfields_dict.data = userfields_dict.data | combine({'Territorio': territorio}) %}
                      {% endif %}
                      {% if "Luogo_di_lavoro" in userfields_str %}
                        {% set luogo = userfields_str.split("'Luogo_di_lavoro'")[1].split("'")[1] %}
                        {% set userfields_dict.data = userfields_dict.data | combine({'Luogo_di_lavoro': luogo}) %}
                      {% endif %}
                      
                      {% set current_chore.data = {'assigned_to': userfields_dict.data.Territorio, 'luogo_di_lavoro': userfields_dict.data.Luogo_di_lavoro} %}
                    {% endif %}
                  {% endif %}
                  
                  {% if 'Added details for chore ' in line %}
                    {% set chore_name = line.split('Added details for chore ')[1] | trim %}
                    {% set current_chore.data = current_chore.data | combine({'name': chore_name}) %}
                  {% endif %}
                  
                  {% if 'Extracted main section: ' in line %}
                    {% set description = line.split('Extracted main section: ')[1] | trim %}
                    {% set current_chore.data = current_chore.data | combine({'description': description}) %}
                  {% endif %}
                  
                  {% if current_chore.data.name is defined and current_chore.data.description is defined and current_chore.data.assigned_to is defined %}
                    {% set chores_found = true %}
                    {
                      "assigned_to": "{{ current_chore.data.assigned_to }}",
                      "luogo_di_lavoro": "{{ current_chore.data.luogo_di_lavoro }}",
                      "name": "{{ current_chore.data.name }}",
                      "date": "Monday, Mar 18",
                      "description": "{{ current_chore.data.description }}"
                    }{% if not loop.last %},{% endif %}
                    {% set current_chore.data = {} %}
                  {% endif %}
                {% endfor %}
              {% endif %}
              {% if not chores_found %}
                {
                  "assigned_to": "Ognidove",
                  "luogo_di_lavoro": "Tempio",
                  "name": "Ispezionare e pulire i filtri dell'acqua",
                  "date": "Monday, Mar 18",
                  "description": "Open and clean the water filter containers and inspect the health of the filters."
                }
              {% endif %}
            ]

      - name: "Grocy Chores"
        unique_id: grocy_chores
        state: >-
          {% set data = states('sensor.grocy_chores_data') %}
          {% if data and data != '[]' and data != 'unknown' %}
            {% if data is string %}
              {% set json_data = data | from_json %}
              {{ json_data | length if json_data is sequence else 0 }}
            {% else %}
              0
            {% endif %}
          {% else %}
            0
          {% endif %}
        icon: mdi:calendar-check
        attributes:
          chores: >-
            {{ states('sensor.grocy_chores_data') }}

            
      - name: "Weather Run Status"
        unique_id: weather_run_status
        state: "unknown"

      - name: "Shelly Connectivity"
        unique_id: shelly_connectivity
        state: >-
          {% if is_state('switch.shelly_relay_caldaia', 'unavailable') %}
            unavailable
          {% else %}
            connected
          {% endif %}
        attributes:
          last_unavailable: >-
            {% set lookback = now().timestamp() - 60 %}
            {% set history = state_attr('sensor.shellyplus1_fcb467bef114_status', 'history') | default([]) %}
            {% if history | selectattr('state', 'eq', 'unavailable') | list %}
              recent
            {% else %}
              not_recent
            {% endif %}

      # Storage sensors
      - name: "Storage Data"
        unique_id: storage_data
        state: >-
          {% set data = states('sensor.storage_data_raw') | default('{}') %}
          {{ data }}

      - name: "Storage Total Space"
        unique_id: storage_total_space
        icon: mdi:harddisk
        state: >-
          {% set data = states('sensor.storage_data_raw') %}
          {% if data and data != 'unknown' and data != '{}' %}
            {% set json_data = data | from_json %}
            {% if json_data.disk and json_data.disk.total_human %}
              {{ json_data.disk.total_human }}
            {% else %}
              Unknown
            {% endif %}
          {% else %}
            Unknown
          {% endif %}

      # Add other storage sensors here following the same pattern

command_line:
  - sensor:
      name: "Grocy Log Content"
      unique_id: grocy_log_content
      command: "cat /config/www/logs/grocy.log 2>/dev/null | tail -n 10 | grep -m 1 'Sent notification' || echo 'No notifications found'"
      scan_interval: 300
  - sensor:
      name: "Storage Data Raw"
      unique_id: storage_data_raw
      command: "cat /config/www/data/storage_data.json 2>/dev/null || echo '{}'"
      scan_interval: 3600
  - sensor:
      name: "Grocy Chores Data"
      unique_id: grocy_chores_data
      command: "cat /config/www/grocy_dashboard_data.json 2>/dev/null || echo '[]'"
      scan_interval: 300
      value_template: "{{ 'available' }}"
      json_attributes:
        - chores
      json_attributes_path: "$"

  - sensor:
      name: "Grocy Summary"
      unique_id: grocy_summary
      command: "cat /config/www/grocy_processed/summary.json 2>/dev/null || echo '{\"count\":0,\"has_data\":false}'"
      value_template: "{{ value_json.count }}"
      scan_interval: 300
      json_attributes:
        - count
        - has_data
        - territories
        - locations
        - people
      
  - sensor:
      name: "Grocy Index"
      unique_id: grocy_index
      command: "cat /config/www/grocy_processed/index.json 2>/dev/null || echo '{}'"
      value_template: "{{ value_json.keys() | list | length }}"
      scan_interval: 300