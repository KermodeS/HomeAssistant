# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# Include other YAML files
script: !include scripts.yaml
scene: !include scenes.yaml
automation: !include automations.yaml
telegram_bot: !include telegram_bot.yaml
shell_command: !include shell_command.yaml

# Notifier
notify:
  - platform: telegram
    name: "kermode"
    chat_id: !secret telegram_kermode_chat_id

# Input entities for configuration
input_text:
  grocy_url:
    name: Grocy API URL
    initial: !secret grocy_base_url
  grocy_api_key:
    name: Grocy API Key
    initial: !secret grocy_api_key
  shelly_caldaia_entity:
    name: Shelly Caldaia Entity
    initial: !secret shelly_caldaia_switch_entity_id
  voltage_sensor_entity:
    name: Voltage Sensor Entity
    initial: sensor.shelly_uni_voltage

input_boolean:
  debug_mode:
    name: Debug Mode
    initial: false
  voltage_alarm_active:
    name: Voltage Alarm Active
    initial: false
    icon: mdi:alarm-light
  enable_voltage_monitoring:
    name: Enable Voltage Monitoring
    initial: off
    icon: mdi:flash-alert

# Template sensors
template:
  - sensor:
      - name: "Grocy Script Token"
        state: !secret grocy_script_token
        unique_id: grocy_script_token

      - name: "Grocy Chores Message"
        unique_id: grocy_chores_message
        state: >-
          {% set log_content = states('sensor.grocy_log_content') %}
          {% if log_content and log_content != 'unknown' and log_content != 'unavailable' %}
            {% set lines = log_content.split('\n') %}
            {% for line in lines %}
              {% if 'Sent notification with' in line %}
                {% set chores = line.split('Sent notification with')[1].split('chores')[0].strip() %}
                {% if chores %}
                  {{ chores }}
                  {% break %}
                {% endif %}
              {% endif %}
            {% endfor %}
            No chores found in log
          {% else %}
            No log data available
          {% endif %}
      # Add these below your existing sensors
      - name: "Grocy Run Status"
        unique_id: grocy_run_status
        state: "unknown"

      - name: "Weather Run Status"
        unique_id: weather_run_status
        state: "unknown"

command_line:
  - sensor:
      name: "Grocy Log Content"
      unique_id: grocy_log_content
      command: "cat /config/www/logs/grocy.log 2>/dev/null | tail -n 10 | grep -m 1 'Sent notification' || echo 'No notifications found'"
      scan_interval: 300
